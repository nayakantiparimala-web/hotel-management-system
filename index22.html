<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input,
        select {
            width: 28%;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .delete {
            background: red;
        }

        .checkout {
            background: green;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        #count {
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            input,
            select,
            button {
                width: 100%;
                margin: 5px 0;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Hotel Management System</h1>
    <p>Full Stack Development Project</p>
</header>

<div class="container">

    <div class="card">
        <h2>Guest Registration</h2>

        <input
            type="text"
            id="name"
            placeholder="Guest Name"
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
        >

        <select id="room">
            <option value="">Select Room</option>
            <option value="101">Room 101</option>
            <option value="102">Room 102</option>
            <option value="103">Room 103</option>
            <option value="104">Room 104</option>
        </select>

        <input
            type="number"
            id="days"
            placeholder="Number of Days"
        >

        <button onclick="addGuest()">
            Book Room
        </button>
    </div>

    <div class="card">

        <h2>Search Guest</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by guest name or room"
            onkeyup="searchGuest()"
        >

        <p>
            Total Bookings:
            <span id="count">0</span>
        </p>

    </div>

    <div class="card">

        <h2>Booking Details</h2>

        <table>

            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Guest Name</th>
                    <th>Phone</th>
                    <th>Room</th>
                    <th>Days</th>
                    <th>Bill</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="guestTable"></tbody>

        </table>

    </div>

</div>

<script>

    let guests =
        JSON.parse(localStorage.getItem("guests")) || [];

    displayGuests(guests);

    function addGuest() {

        let name =
            document.getElementById("name").value.trim();

        let phone =
            document.getElementById("phone").value.trim();

        let room =
            document.getElementById("room").value;

        let days =
            Number(document.getElementById("days").value);

        if (
            name === "" ||
            phone === "" ||
            room === "" ||
            days <= 0
        ) {
            alert("Please fill all fields correctly");
            return;
        }

        let roomPrice = 1500;
        let bill = roomPrice * days;

        let guest = {
            name: name,
            phone: phone,
            room: room,
            days: days,
            bill: bill,
            status: "Booked"
        };

        guests.push(guest);

        localStorage.setItem(
            "guests",
            JSON.stringify(guests)
        );

        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("room").value = "";
        document.getElementById("days").value = "";

        displayGuests(guests);
    }

    function displayGuests(list) {

        let table =
            document.getElementById("guestTable");

        table.innerHTML = "";

        list.forEach(function(guest, index) {

            let row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${guest.name}</td>
                <td>${guest.phone}</td>
                <td>${guest.room}</td>
                <td>${guest.days}</td>
                <td>₹${guest.bill}</td>
                <td>${guest.status}</td>
                <td>
                    <button
                        class="checkout"
                        onclick="checkoutGuest(${index})">
                        Checkout
                    </button>

                    <button
                        class="delete"
                        onclick="deleteGuest(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });

        document.getElementById("count").innerText =
            list.length;
    }

    function checkoutGuest(index) {

        guests[index].status = "Checked Out";

        localStorage.setItem(
            "guests",
            JSON.stringify(guests)
        );

        displayGuests(guests);
    }

    function deleteGuest(index) {

        guests.splice(index, 1);

        localStorage.setItem(
            "guests",
            JSON.stringify(guests)
        );

        displayGuests(guests);
    }

    function searchGuest() {

        let text =
            document.getElementById("search")
            .value
            .toLowerCase();

        let filtered =
            guests.filter(function(guest) {

                return (
                    guest.name
                        .toLowerCase()
                        .includes(text) ||

                    guest.room
                        .toLowerCase()
                        .includes(text)
                );
            });

        displayGuests(filtered);
    }

</script>

</body>
</html>
